[pytest]
testpaths = tests
markers =
    pipeline: loads the PSGC graph, location matcher or disaster classifier (1-3 min)
    slow: full geodata regression checks (>10 min)
    network: needs internet access (live DROMIC feed)
    graphdb: needs GraphDB running on localhost:7200 with repository SakunaGraPH-dev
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
